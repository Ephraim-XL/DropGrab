[workspace]
resolver = "2"
members = ["crates/dg-types", "crates/dg-core", "crates/dg-daemon"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.75"

[workspace.dependencies]
dg-types = { path = "crates/dg-types" }
dg-core = { path = "crates/dg-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
