[package]
name = "dg-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "DropGrab engine: control API, discovery, peer transfer, downloads, library"

[dependencies]
dg-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
thiserror = { workspace = true }
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rcgen = "0.13"
sha2 = "0.10.9"
hex = "0.4.3"
rand = "0.8"
uuid = { version = "1.20.0", features = ["v4"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
futures-util = "0.3.34"
bytes = "1.12.2"
http-body-util = "0.1.5"
time = "0.3.41"
socket2 = "0.5"
x509-parser = "0.18.1"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
tokio-util = { version = "0.7.19", features = ["io"] }
libc = "0.2.191"
tower-service = "0.3"

[dev-dependencies]
tempfile = "3.27.0"
tracing-subscriber.workspace = true
